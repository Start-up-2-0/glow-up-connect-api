name: CI (staging)

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GLOWAPI.sln

      - name: Build
        run: dotnet build GLOWAPI.sln --no-restore -c Release

      - name: Test
        run: dotnet test GLOWAPI.sln --no-build -c Release --verbosity normal

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GLOWAPI.sln

      - name: Vulnerable packages
        run: dotnet list GLOWAPI.sln package --vulnerable --include-transitive || true

      - name: Trivy Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: 1
